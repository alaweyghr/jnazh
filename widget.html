// استبدل قسم الـ <script> في أسفل ملف widget.html بهذا الكود المباشر:
<script>
  // رابط الـ API الخاص بـ Google Script المستخرج من ملفاتك
  const API_URL = "https://script.google.com/macros/s/AKfycbzBX9SOYeh4pbI5wLg25hMB7RXVfYPpUO7TQncgzo2MmYc5wK6xPUPLaEARR8U0i9hj/exec";

  async function fetchLiveWidgetData() {
    try {
      const response = await fetch(API_URL);
      const data = await response.json();
      
      // 1. تحديث التاريخ الحالي تلقائياً
      const today = new Date();
      const day = String(today.getDate()).padStart(2, '0');
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const year = today.getFullYear();
      document.getElementById("date").innerText = `${day} - ${month} - ${year}`;

      // 2. تحديث وقت آخر تحديث قادم من السكربت
      document.getElementById("updated").innerText = data.lastUpdate || "--:--";

      // 3. التحقق من حالة النظام (مباشر أو انتظار ملخص اليوم)
      if (data.status === "waiting") {
        document.getElementById("mainPrayer").innerText = "ملخص اليوم";
        // حساب إجمالي الجنائز لليوم بالكامل من المصفوفة التراكمية
        const totalToday = data.summary ? data.summary.reduce((a, b) => a + Number(b.total), 0) : 0;
        document.getElementById("mainNumber").innerText = totalToday;
      } else {
        document.getElementById("mainPrayer").innerText = data.prayerName || "صلاة العصر";
        document.getElementById("mainNumber").innerText = data.total || 0;
      }

      // 4. تحديث أعداد الفئات (رجال / نساء / أطفال)
      const men = data.men || 0;
      const women = data.women || 0;
      const child = data.kids || 0; // تم تعديلها إلى kids لتطابق السكربت الخاص بك

      document.getElementById("men").innerText = men;
      document.getElementById("women").innerText = women;
      document.getElementById("child").innerText = child;

      // 5. تحديث حركة البارات (Bars) بشكل ديناميكي متناسق
      // حساب العرض المخصص بناءً على الأرقام الحالية المتوفرة
      document.getElementById("menBar").style.width = `${Math.max(40, men * 15)}px`;
      document.getElementById("womenBar").style.width = `${Math.max(40, women * 15)}px`;
      document.getElementById("childBar").style.width = `${Math.max(40, child * 15)}px`;

      // 6. تحديث قيم الصلوات الجانبية (Pills) تلقائياً من الـ summary الخاص بالسكربت
      // تصفير القيم أولاً كحماية
      let dhuhrTotal = 0, asrTotal = 0, maghribTotal = 0;

      if (data.summary && data.summary.length > 0) {
        data.summary.forEach(item => {
          const name = item.prayer.trim();
          if (name.includes("الظهر")) dhuhrTotal = item.total;
          if (name.includes("العصر")) asrTotal = item.total;
          if (name.includes("المغرب")) maghribTotal = item.total;
        });
      }

      document.getElementById("dhuhr").innerText = `الظهر ${dhuhrTotal}`;
      document.getElementById("asr").innerText = `العصر ${asrTotal}`;
      document.getElementById("maghrib").innerText = `المغرب ${maghribTotal}`;

    } catch (error) {
      console.error("خطأ أثناء مزامنة بيانات الويدجت:", error);
    }
  }

  // تشغيل الجلب فور تحميل الصفحة
  fetchLiveWidgetData();

  // تحديث تلقائي مستمر كل دقيقة (60000 مللي ثانية) لضمان حيوية البيانات على الشاشة
  setInterval(fetchLiveWidgetData, 60000);
</script>
