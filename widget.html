<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جنائز الراجحي - ويدجت الآيفون المطور</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #1c2a38; /* جعل الخلفية نفس لون الويدجت ليتناسق تماماً */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 5px;
      overflow: hidden;
    }

    /* الحاوية الخارجية - تم إلغاء العرض الكبير وجعله مرناً ومتوافقاً مع الآيفون */
    .widget-wrapper {
      width: 100%;
      max-width: 360px; /* المقاس المثالي لويدجت الآيفون المتوسط */
      display: flex;
      flex-direction: column;
    }

    /* التبويبات العلوية المصغرة */
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: -1px;
      z-index: 2;
    }

    .tab {
      background-color: #384d61;
      color: #b0c4de;
      padding: 4px 15px;
      border-radius: 8px 8px 0 0;
      font-size: 11px;
      font-weight: bold;
      user-select: none;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    }

    .tab.active {
      background-color: #f7b749;
      color: #1a2633;
    }

    /* جسم الويدجت الرئيسي المضغوط */
    .widget-body {
      background-color: #1c2a38;
      border-radius: 16px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      height: 145px; /* ارتفاع ثابت متناسق مع الآيفون */
      border: 1px solid #2d3d4f;
    }

    /* الشريط البني الأيسر كخلفية (Padding-left يحمي العناصر من الاختفاء تحته) */
    .widget-body::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 25px; /* تقليص عرض الشريط ليناسب المساحة */
      background-color: #7d5a52;
      z-index: 1;
    }

    /* المربع الأصفر للرقم الكبير */
    .number-box {
      background-color: #f7b749;
      color: #1a2633;
      width: 65px;
      height: 65px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* قسم الإحصائيات الأوسط - تم تصغيره لتقريب المسافات */
    .stats-section {
      flex: 1;
      padding: 0 10px;
      z-index: 2;
    }

    .stat-row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      color: #a0b2c6;
      font-size: 11px;
    }

    .stat-label {
      width: 30px;
      font-weight: 500;
    }

    .progress-bar-container {
      flex: 1;
      height: 5px;
      background-color: #2d3d4f;
      border-radius: 3px;
      margin: 0 8px;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      border-radius: 3px;
      width: 0%; 
      transition: width 0.6s ease-in-out;
    }

    .progress-men { background-color: #ff7643; }
    .progress-women { background-color: #f7b749; }
    .progress-children { background-color: #4285f4; }

    .stat-value {
      color: #fff;
      font-weight: bold;
      width: 15px;
      text-align: left;
    }

    /* الجزء الأيسر للصلوات - تم تأمينه وإبعاده عن الحافة لتجنب التداخل مع الشريط البني */
    .left-section {
      width: 95px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 2;
      margin-left: 15px; /* إبعاد كامل القسم عن الشريط البني المستقر في أقصى اليسار */
    }

    .prayer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #798e9c;
      border-bottom: 1px solid #2d3d4f;
      padding-bottom: 2px;
    }

    .prayer-row.active-row {
      color: #4da3ff;
      font-weight: bold;
    }
    
    .prayer-row.active-row .badge {
      background-color: #1a3a5f;
      color: #4da3ff;
    }

    .badge {
      background-color: #243547;
      color: #4da3ff;
      padding: 1px 5px;
      border-radius: 6px;
      font-weight: bold;
      min-width: 18px;
      text-align: center;
      font-size: 9px;
    }

    /* التذييل السفلي المصغر */
    .widget-footer {
      position: absolute;
      bottom: 6px;
      right: 15px;
      left: 35px; /* حماية النص من الدخول تحت الشريط البني */
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #63778a;
      z-index: 2;
    }

    .time-val, .date-val {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="widget-wrapper">
    
    <div class="tabs" id="tabsContainer">
      <div class="tab active" id="tabMode">جاري المزامنة...</div>
    </div>
    
    <div class="widget-body">
      <div class="number-box" id="totalNumber">0</div>
      
      <div class="stats-section">
        <div class="stat-row">
          <span class="stat-label">رجال</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-men" id="barMen"></div>
          </div>
          <span class="stat-value" id="valMen">0</span>
        </div>
        
        <div class="stat-row">
          <span class="stat-label">نساء</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-women" id="barWomen"></div>
          </div>
          <span class="stat-value" id="valWomen">0</span>
        </div>
        
        <div class="stat-row">
          <span class="stat-label">أطفال</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-children" id="barChildren"></div>
          </div>
          <span class="stat-value" id="valChildren">0</span>
        </div>
      </div>
      
      <div class="left-section">
        <div class="prayer-row" id="row-الظهر">
          <span>الظهر</span>
          <span class="badge" id="badge-الظهر">0</span>
        </div>
        <div class="prayer-row" id="row-العصر">
          <span>العصر</span>
          <span class="badge" id="badge-العصر">0</span>
        </div>
        <div class="prayer-row" id="row-المغرب">
          <span>المغرب</span>
          <span class="badge" id="badge-المغرب">0</span>
        </div>
      </div>
      
      <div class="widget-footer">
        <div>تحديث: <span class="time-val" id="lastUpdate">--:--</span></div>
        <div id="currentDate" class="date-val">DD/MM/YYYY</div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzBX9SOYeh4pbI5wLg25hMB7RXVfYPpUO7TQncgzo2MmYc5wK6xPUPLaEARR8U0i9hj/exec";

    async function fetchLiveWidgetData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        const tabMode = document.getElementById('tabMode');
        if (data.status === "waiting") {
          tabMode.innerText = "ملخص جنائز اليوم";
          tabMode.style.backgroundColor = "#f7b749";
          tabMode.style.color = "#1a2633";
        } else {
          tabMode.innerText = `مباشر: ${data.prayerName || '--'}`;
          tabMode.style.backgroundColor = "#ff7643";
          tabMode.style.color = "#fff";
        }

        let menCount = data.men || 0;
        let womenCount = data.women || 0;
        let kidsCount = data.kids || 0;
        let totalCount = 0;

        if (data.status === "waiting") {
          totalCount = data.summary ? data.summary.reduce((a, b) => a + Number(b.total), 0) : 0;
        } else {
          totalCount = data.total || 0;
        }

        document.getElementById('totalNumber').innerText = totalCount;
        document.getElementById('valMen').innerText = menCount;
        document.getElementById('valWomen').innerText = womenCount;
        document.getElementById('valChildren').innerText = kidsCount;
        document.getElementById('lastUpdate').innerText = data.lastUpdate || "--:--";

        const max = totalCount || 1; 
        document.getElementById('barMen').style.width = `${(menCount / max) * 100}%`;
        document.getElementById('barWomen').style.width = `${(womenCount / max) * 100}%`;
        document.getElementById('barChildren').style.width = `${(kidsCount / max) * 100}%`;

        const prayers = ["الظهر", "العصر", "المغرب"];
        prayers.forEach(p => {
          const badge = document.getElementById(`badge-${p}`);
          const row = document.getElementById(`row-${p}`);
          if(badge) badge.innerText = "0";
          if(row) row.classList.remove('active-row');
        });

        if (data.summary && data.summary.length > 0) {
          data.summary.forEach(item => {
            const cleanName = item.prayer.replace("صلاة ", "").trim();
            const badge = document.getElementById(`badge-${cleanName}`);
            if (badge) {
              badge.innerText = item.total;
            }
          });
        }

        if (data.status === "live" && data.prayerName) {
          const activeCleanName = data.prayerName.replace("صلاة ", "").trim();
          const activeRow = document.getElementById(`row-${activeCleanName}`);
          if (activeRow) activeRow.classList.add('active-row');
        }

        updateBadgeStyling();

      } catch (error) {
        console.error("خطأ مزامنة الآيفون:", error);
      }
    }

    function updateBadgeStyling() {
      const prayers = ["الظهر", "العصر", "المغرب"];
      prayers.forEach(p => {
        const badge = document.getElementById(`badge-${p}`);
        if (badge) {
          const val = parseInt(badge.innerText) || 0;
          if (val === 0) {
            badge.style.color = '#2b5075'; 
          } else {
            badge.style.color = '#52a3ff'; 
          }
        }
      });
    }

    function displayCurrentDate() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      document.getElementById('currentDate').innerText = `${dd}/${mm}/${yyyy}`;
    }

    displayCurrentDate();
    fetchLiveWidgetData();
    setInterval(fetchLiveWidgetData, 30000);
  </script>
</body>
</html>
