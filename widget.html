<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=1014,height=474,initial-scale=1.0"
  />

  <title>
    جنايز الراجحي Widget
  </title>

  <!-- الخط -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->

  <link rel="stylesheet" href="widget.css">

</head>

<body>

  <!-- الخلفية -->

  <div class="bg-lines">

    <div class="line line1"></div>

    <div class="line line2"></div>

    <div class="line line3"></div>

  </div>

  <!-- الحاوية -->

  <div class="wrapper">

    <!-- القسم الأيمن -->

    <div class="right">

      <div class="prayer" id="mainPrayer">
        صلاة العصر
      </div>

      <div class="main-number" id="mainNumber">
        16
      </div>

      <div class="dua">
        غفر الله لنا ولهم
      </div>

    </div>

    <!-- الفاصل -->

    <div class="divider"></div>

    <!-- القسم الأيسر -->

    <div class="left">

      <!-- الأعلى -->

      <div class="top">

        <div class="date" id="date">
          --
        </div>

        <div class="update">

          <div class="update-title">
            آخر تحديث
          </div>

          <div class="update-time" id="updated">
            --:--
          </div>

        </div>

      </div>

      <!-- البارات -->

      <div class="bars">

        <!-- رجل -->

        <div class="bar-row">

          <div class="bar-label">
            رجل
          </div>

          <div class="bar-bg">

            <div
              class="bar-fill men"
              id="menBar"
            >
              <span id="men">
                0
              </span>
            </div>

          </div>

        </div>

        <!-- امرأة -->

        <div class="bar-row">

          <div class="bar-label">
            امرأة
          </div>

          <div class="bar-bg">

            <div
              class="bar-fill women"
              id="womenBar"
            >
              <span id="women">
                0
              </span>
            </div>

          </div>

        </div>

        <!-- طفل -->

        <div class="bar-row">

          <div class="bar-label">
            طفل
          </div>

          <div class="bar-bg">

            <div
              class="bar-fill child"
              id="childBar"
            >
              <span id="child">
                0
              </span>
            </div>

          </div>

        </div>

      </div>

      <!-- الأسفل -->

      <div class="bottom">

        <div class="summary">

          <span>
            ملخص اليوم
          </span>

          <span>
            جميع الصلوات
          </span>

        </div>

        <div class="pills">

          <div class="pill" id="dhuhr">
            الظهر 0
          </div>

          <div class="pill" id="asr">
            العصر 0
          </div>

          <div class="pill" id="maghrib">
            المغرب 0
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- JS -->

  <script>

    async function loadData(){

      const response = await fetch(
        "https://raw.githubusercontent.com/alaweyghr/jnazh/main/data.json"
      )

      const data = await response.json()

      // التاريخ التلقائي

      const now = new Date()

      const day =
        String(now.getDate()).padStart(2,'0')

      const month =
        String(now.getMonth()+1).padStart(2,'0')

      const year =
        now.getFullYear()

      document.getElementById("date")
      .innerText =
      `${day} - ${month} - ${year}`

      // آخر تحديث

      document.getElementById("updated")
      .innerText =
      data.updated || "--:--"

      // الرئيسية

      document.getElementById("mainPrayer")
      .innerText =
      data.mainPrayer || "صلاة العصر"

      document.getElementById("mainNumber")
      .innerText =
      data.mainNumber || 0

      // البيانات

      const men =
        data.men || 0

      const women =
        data.women || 0

      const child =
        data.child || 0

      // الأرقام

      document.getElementById("men")
      .innerText = men

      document.getElementById("women")
      .innerText = women

      document.getElementById("child")
      .innerText = child

      // البارات

      document.getElementById("menBar")
      .style.width =
      `${Math.max(80, men * 18)}px`

      document.getElementById("womenBar")
      .style.width =
      `${Math.max(80, women * 18)}px`

      document.getElementById("childBar")
      .style.width =
      `${Math.max(80, child * 18)}px`

      // pills

      document.getElementById("dhuhr")
      .innerText =
      `الظهر ${data.dhuhr || 0}`

      document.getElementById("asr")
      .innerText =
      `العصر ${data.asr || 0}`

      document.getElementById("maghrib")
      .innerText =
      `المغرب ${data.maghrib || 0}`
    }

    loadData()

    // تحديث تلقائي

    setInterval(
      loadData,
      60000
    )

  </script>

</body>
</html>
