<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1014,height=474,initial-scale=1.0" />

  <title>جنايز الراجحي Widget</title>

  <!-- الخط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{

      width:1014px;
      height:474px;

      overflow:hidden;

      font-family:'Tajawal',sans-serif;

      background:#E7DCCD;

      color:#111;
    }

    body{

      position:relative;

      padding:32px;
    }

    /* الخلفية */

    .bg-lines{

      position:absolute;
      inset:0;

      opacity:.35;

      pointer-events:none;
    }

    .line{

      position:absolute;

      height:2px;

      background:#F3E9DD;

      transform-origin:left center;
    }

    .line1{
      width:340px;
      top:40px;
      left:-40px;
      transform:rotate(-18deg);
    }

    .line2{
      width:380px;
      top:160px;
      left:-80px;
      transform:rotate(-20deg);
    }

    .line3{
      width:420px;
      bottom:40px;
      left:-120px;
      transform:rotate(-22deg);
    }

    /* الحاوية */

    .wrapper{

      width:100%;
      height:100%;

      display:flex;

      flex-direction:row;

      align-items:center;

      justify-content:space-between;

      position:relative;

      z-index:2;
    }

    /* اليمين */

    .right{

      width:300px;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;
    }

    .prayer{

      font-size:42px;

      font-weight:800;

      margin-bottom:8px;
    }

    .main-number{

      font-size:180px;

      font-weight:800;

      line-height:1;

      color:#07142B;
    }

    .dua{

      margin-top:8px;

      font-size:26px;

      font-weight:500;

      color:#222;
    }

    /* الفاصل */

    .divider{

      width:12px;

      height:320px;

      border-radius:999px;

      background:#5B9E97;
    }

    /* اليسار */

    .left{

      width:520px;

      height:100%;

      display:flex;

      flex-direction:column;

      justify-content:space-between;
    }

    /* الأعلى */

    .top{

      display:flex;

      align-items:flex-start;

      justify-content:space-between;
    }

    .date{

      font-size:26px;

      font-weight:700;

      color:#444;
    }

    .update{

      text-align:left;
    }

    .update-title{

      font-size:18px;

      color:#666;

      margin-bottom:4px;
    }

    .update-time{

      font-size:28px;

      font-weight:800;
    }

    /* البارات */

    .bars{

      margin-top:24px;

      display:flex;

      flex-direction:column;

      gap:18px;
    }

    .bar-row{

      display:flex;

      align-items:center;

      gap:18px;
    }

    .bar-label{

      width:80px;

      font-size:30px;

      font-weight:700;
    }

    .bar-bg{

      width:320px;

      height:52px;

      background:#EFEFEF;

      border-radius:999px;

      overflow:hidden;
    }

    .bar-fill{

      height:100%;

      display:flex;

      align-items:center;

      justify-content:flex-start;

      padding-inline:22px;

      border-radius:999px;

      color:white;

      font-size:28px;

      font-weight:800;
    }

    .men{
      background:#7A7A7A;
    }

    .women{
      background:#696969;
    }

    .child{
      background:#000;
    }

    /* الأسفل */

    .bottom{

      display:flex;

      flex-direction:column;

      gap:16px;
    }

    .summary{

      display:flex;

      justify-content:space-between;

      align-items:center;

      font-size:24px;

      color:#444;

      font-weight:600;
    }

    .pills{

      display:flex;

      gap:12px;
    }

    .pill{

      background:#07142B;

      color:white;

      border-radius:999px;

      padding:10px 18px;

      font-size:22px;

      font-weight:700;
    }

  </style>
</head>

<body>

  <!-- خطوط الخلفية -->

  <div class="bg-lines">

    <div class="line line1"></div>

    <div class="line line2"></div>

    <div class="line line3"></div>

  </div>

  <!-- الحاوية -->

  <div class="wrapper">

    <!-- اليمين -->

    <div class="right">

      <div class="prayer" id="mainPrayer">
        صلاة العصر
      </div>

      <div class="main-number" id="mainNumber">
        16
      </div>

      <div class="dua">
        غفر الله لنا ولهم
      </div>

    </div>

    <!-- الفاصل -->

    <div class="divider"></div>

    <!-- اليسار -->

    <div class="left">

      <!-- الأعلى -->

      <div class="top">

        <div class="date" id="date">
          --
        </div>

        <div class="update">

          <div class="update-title">
            آخر تحديث
          </div>

          <div class="update-time" id="updated">
            --:--
          </div>

        </div>

      </div>

      <!-- البارات -->

      <div class="bars">

        <!-- رجل -->

        <div class="bar-row">

          <div class="bar-label">
            رجل
          </div>

          <div class="bar-bg">

            <div
              class="bar-fill men"
              id="menBar"
            >
              <span id="men">
                0
              </span>
            </div>

          </div>

        </div>

        <!-- امرأة -->

        <div class="bar-row">

          <div class="bar-label">
            امرأة
          </div>

          <div class="bar-bg">

            <div
              class="bar-fill women"
              id="womenBar"
            >
              <span id="women">
                0
              </span>
            </div>

          </div>

        </div>

        <!-- طفل -->

        <div class="bar-row">

          <div class="bar-label">
            طفل
          </div>

          <div class="bar-bg">

            <div
              class="bar-fill child"
              id="childBar"
            >
              <span id="child">
                0
              </span>
            </div>

          </div>

        </div>

      </div>

      <!-- الأسفل -->

      <div class="bottom">

        <div class="summary">

          <span>
            ملخص اليوم
          </span>

          <span>
            جميع الصلوات
          </span>

        </div>

        <div class="pills">

          <div class="pill" id="dhuhr">
            الظهر 0
          </div>

          <div class="pill" id="asr">
            العصر 0
          </div>

          <div class="pill" id="maghrib">
            المغرب 0
          </div>

        </div>

      </div>

    </div>

  </div>

  <script>

    async function loadData(){

      const response = await fetch(
        "https://raw.githubusercontent.com/alaweyghr/jnazh/main/data.json"
      )

      const data = await response.json()

      // التاريخ

      const now = new Date()

      const day =
        String(now.getDate()).padStart(2,'0')

      const month =
        String(now.getMonth()+1).padStart(2,'0')

      const year =
        now.getFullYear()

      document.getElementById("date")
      .innerText =
      `${day} - ${month} - ${year}`

      // التحديث

      document.getElementById("updated")
      .innerText =
      data.updated || "--:--"

      // الرئيسية

      document.getElementById("mainPrayer")
      .innerText =
      data.mainPrayer || "صلاة العصر"

      document.getElementById("mainNumber")
      .innerText =
      data.mainNumber || 0

      // البارات

      const men =
        data.men || 0

      const women =
        data.women || 0

      const child =
        data.child || 0

      document.getElementById("men")
      .innerText = men

      document.getElementById("women")
      .innerText = women

      document.getElementById("child")
      .innerText = child

      document.getElementById("menBar")
      .style.width =
      `${Math.max(80, men * 18)}px`

      document.getElementById("womenBar")
      .style.width =
      `${Math.max(80, women * 18)}px`

      document.getElementById("childBar")
      .style.width =
      `${Math.max(80, child * 18)}px`

      // pills

      document.getElementById("dhuhr")
      .innerText =
      `الظهر ${data.dhuhr || 0}`

      document.getElementById("asr")
      .innerText =
      `العصر ${data.asr || 0}`

      document.getElementById("maghrib")
      .innerText =
      `المغرب ${data.maghrib || 0}`
    }

    loadData()

  </script>

</body>
</html>
