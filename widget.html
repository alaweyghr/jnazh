<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جنائز الراجحي - ويدجت ذكي كامل المساحة وثابت</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #1c2a38;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: auto; /* تم إلغاء 100vh لمنع اختفاء الويدجت عند تلاعب التطبيق بالأشرطة */
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    /* الحاوية الخارجية تملأ أبعاد مستطيل الآيفون بشكل مستقر وثابت */
    .widget-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* نظام التبويبات الأربعة المتناسقة أفقياً */
    .tabs {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background-color: #1c2a38;
      padding: 4px 6px 0 6px;
      z-index: 2;
    }

    .tab {
      background-color: #1c2a38;
      color: #718394; /* الوضع الافتراضي مغلق OFF */
      padding: 5px 0;
      width: 305px;
      text-align: center;
      border-radius: 6px 6px 0 0;
      font-size: 10px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    /* وضع التشغيل ON للصلاة الحية حالياً */
    .tab.live-on {
      background-color: #ff7643;
      color: #fff;
      box-shadow: 0 -2px 6px rgba(255,118,67,0.3);
    }

    /* وضع التشغيل ON لملخص اليوم */
    .tab.summary-on {
      background-color: #a6d99bfe;
      color: #1a2633;
      box-shadow: 0 -2px 6px #1c2a38;
    }

    /* جسم الويدجت الرئيسي الممتد بالكامل بارتفاع حقيقي ومؤمن */
    .widget-body {
      background-color: #1c2a38;
      padding: 12px 12px 24px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      height: 130px; /* ارتفاع حقيقي ثابت يملأ مساحة الـ Medium Widget بالكامل */
      border-bottom: 1px solid #2d3d4f;
    }

    /* مربع العدد الإجمالي الكبير الأيمن */
    .number-box {
      background-color: #a1cae3;
      color: #1a2633;
      width: 58px;
      height: 58px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* قسم الإحصائيات الأوسط */
    .stats-section {
      flex: 1;
      padding: 0 12px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      color: #a0b2c6;
      font-size: 10px;
    }

    .stat-label {
      width: 26px;
      font-weight: bold;
    }

    .progress-bar-container {
      flex: 1;
      height: 4px;
      background-color: #2d3d4f;
      border-radius: 2px;
      margin: 0 6px;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      border-radius: 2px;
      width: 0%; 
      transition: width 0.6s ease-in-out;
    }

    .progress-men { background-color: #ff7643; }
    .progress-women { background-color: #f7b749; }
    .progress-children { background-color: #4285f4; }

    .stat-value {
      color: #fff;
      font-weight: bold;
      width: 14px;
      text-align: left;
    }

    /* الجزء الأيسر للصلوات */
    .left-section {
      width: 95px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .prayer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #dcdc8a;
      border-bottom: 1px solid #2d3d4f;
      padding-bottom: 1px;
    }

    .prayer-row.active-row {
      color: #4da3ff;
      font-weight: bold;
    }
    
    .prayer-row.active-row .badge {
      background-color: #a4c2e4;
      color: #4da3ff;
    }

    .badge {
      background-color: #4c5258;
      color: #ffffff;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: bold;
      min-width: 18px;
      text-align: center;
      font-size: 8px;
    }

    /* التذييل السفلي المتناسق والثابت لحمايته من الاختفاء */
    .widget-footer {
      position: absolute;
      bottom: 6px;
      right: 12px;
      left: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: #63778a;
    }

    .time-val, .date-val {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="widget-wrapper">
    
    <div class="tabs">
      <div class="tab" id="tab-الظهر">الظهر</div>
      <div class="tab" id="tab-العصر">العصر</div>
      <div class="tab" id="tab-المغرب">المغرب</div>
      <div class="tab" id="tab-الملخص">ملخص اليوم</div>
    </div>
    
    <div class="widget-body">
      <div class="number-box" id="totalNumber">0</div>
      
      <div class="stats-section">
        <div class="stat-row">
          <span class="stat-label">رجال</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-men" id="barMen"></div>
          </div>
          <span class="stat-value" id="valMen">0</span>
        </div>
        
        <div class="stat-row">
          <span class="stat-label">نساء</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-women" id="barWomen"></div>
          </div>
          <span class="stat-value" id="valWomen">0</span>
        </div>
        
        <div class="stat-row">
          <span class="stat-label">أطفال</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-children" id="barChildren"></div>
          </div>
          <span class="stat-value" id="valChildren">0</span>
        </div>
      </div>
      
      <div class="left-section">
        <div class="prayer-row" id="row-الظهر">
          <span>صلاة الظهر</span>
          <span class="badge" id="badge-الظهر">0</span>
        </div>
        <div class="prayer-row" id="row-العصر">
          <span>صلاة العصر</span>
          <span class="badge" id="badge-العصر">0</span>
        </div>
        <div class="prayer-row" id="row-المغرب">
          <span>صلاة المغرب</span>
          <span class="badge" id="badge-المغرب">0</span>
        </div>
      </div>
      
      <div class="widget-footer">
        <div>تحديث: <span class="time-val" id="lastUpdate">--:--</span></div>
        <div id="currentDate" class="date-val">DD/MM/YYYY</div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzBX9SOYeh4pbI5wLg25hMB7RXVfYPpUO7TQncgzo2MmYc5wK6xPUPLaEARR8U0i9hj/exec";

    async function fetchLiveWidgetData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        const tabsList = ["الظهر", "العصر", "المغرب", "الملخص"];
        tabsList.forEach(t => {
          const tElement = document.getElementById(`tab-${t}`);
          if (tElement) {
            tElement.className = "tab";
          }
        });

        if (data.status === "waiting") {
          const summaryTab = document.getElementById('tab-الملخص');
          if (summaryTab) summaryTab.classList.add('summary-on');
        } else if (data.status === "live" && data.prayerName) {
          const activePrayerKey = data.prayerName.replace("صلاة ", "").trim();
          const activeTab = document.getElementById(`tab-${activePrayerKey}`);
          if (activeTab) activeTab.classList.add('live-on');
        }

        let menCount = data.men || 0;
        let womenCount = data.women || 0;
        let kidsCount = data.kids || 0;
        let totalCount = 0;

        if (data.status === "waiting") {
          totalCount = data.summary ? data.summary.reduce((a, b) => a + Number(b.total), 0) : 0;
        } else {
          totalCount = data.total || 0;
        }

        document.getElementById('totalNumber').innerText = totalCount;
        document.getElementById('valMen').innerText = menCount;
        document.getElementById('valWomen').innerText = womenCount;
        document.getElementById('valChildren').innerText = kidsCount;
        document.getElementById('lastUpdate').innerText = data.lastUpdate || "--:--";

        const max = totalCount || 1; 
        document.getElementById('barMen').style.width = `${(menCount / max) * 100}%`;
        document.getElementById('barWomen').style.width = `${(womenCount / max) * 100}%`;
        document.getElementById('barChildren').style.width = `${(kidsCount / max) * 100}%`;

        const prayers = ["الظهر", "العصر", "المغرب"];
        prayers.forEach(p => {
          const badge = document.getElementById(`badge-${p}`);
          const row = document.getElementById(`row-${p}`);
          if(badge) badge.innerText = "0";
          if(row) row.classList.remove('active-row');
        });

        if (data.summary && data.summary.length > 0) {
          data.summary.forEach(item => {
            const cleanName = item.prayer.replace("صلاة ", "").trim();
            const badge = document.getElementById(`badge-${cleanName}`);
            if (badge) {
              badge.innerText = item.total;
            }
          });
        }

        if (data.status === "live" && data.prayerName) {
          const activeCleanName = data.prayerName.replace("صلاة ", "").trim();
          const activeRow = document.getElementById(`row-${activeCleanName}`);
          if (activeRow) activeRow.classList.add('active-row');
        }

        updateBadgeStyling();

      } catch (error) {
        console.error("خطأ المزامنة الثابتة:", error);
      }
    }

    function updateBadgeStyling() {
      const prayers = ["الظهر", "العصر", "المغرب"];
      prayers.forEach(p => {
        const badge = document.getElementById(`badge-${p}`);
        if (badge) {
          const val = parseInt(badge.innerText) || 0;
          if (val === 0) {
            badge.style.color = '#2b5075'; 
          } else {
            badge.style.color = '#52a3ff'; 
          }
        }
      });
    }

    function displayCurrentDate() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      document.getElementById('currentDate').innerText = `${dd}/${mm}/${yyyy}`;
    }

    displayCurrentDate();
    fetchLiveWidgetData();
    setInterval(fetchLiveWidgetData, 30000);
  </script>
</body>
</html>
