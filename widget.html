<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جنائز الراجحي - ويدجت الآيفون</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #253342;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* الحاوية الخارجية للويدجت والتبويبات */
    .widget-wrapper {
      width: 650px;
    }

    /* التبويبات العلوية */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: -1px;
    }

    .tab {
      background-color: #384d61;
      color: #b0c4de;
      padding: 10px 25px;
      border-radius: 12px 12px 0 0;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .tab.active {
      background-color: #f7b749;
      color: #1a2633;
      font-weight: bold;
    }

    /* جسم الويدجت الرئيسي */
    .widget-body {
      background-color: #1c2a38;
      border-radius: 25px;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between; /* توزيع متناسق وملموم للمساحات */
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* الشريط البني في أقصى اليسار للتوافق مع الاتجاه العربي */
    .widget-body::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 45px;
      background-color: #7d5a52;
    }

    /* المربع الأصفر الأيمن للرقم الكبير */
    .number-box {
      background-color: #f7b749;
      color: #1a2633;
      width: 120px;
      height: 120px;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 54px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    /* قسم الإحصائيات الأوسط - تم تعديله لمنع الفراغات الكبيرة */
    .stats-section {
      width: 260px;       /* عرض ثابت لمنع التمدد الفائض */
      padding: 0 15px;    /* مسافة داخلية متناسقة */
    }

    .stat-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      color: #a0b2c6;
      font-size: 15px;
    }

    .stat-label {
      width: 50px;
    }

    .progress-bar-container {
      flex: 1;
      height: 6px;
      background-color: #2d3d4f;
      border-radius: 3px;
      margin: 0 15px;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      border-radius: 3px;
      width: 0%; 
      transition: width 0.6s ease-in-out;
    }

    /* ألوان مؤشرات التقدم */
    .progress-men { background-color: #ff7643; }
    .progress-women { background-color: #f7b749; }
    .progress-children { background-color: #4285f4; }

    .stat-value {
      color: #fff;
      font-weight: bold;
      width: 20px;
      text-align: left;
    }

    /* الجزء الأيسر للصلوات - تم تقريب المسافة */
    .left-section {
      width: 135px;
      border-left: 10px solid transparent; /* تقريب الفراغ من الأرقام والبارات */
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prayer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #798e9c;
      border-bottom: 1px solid #2d3d4f;
      padding-bottom: 4px;
      transition: all 0.3s ease;
    }

    .prayer-row.active-row {
      color: #4da3ff;
    }
    
    .prayer-row.active-row .badge {
      background-color: #1a3a5f;
      color: #4da3ff;
    }

    .badge {
      background-color: #243547;
      color: #4da3ff;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
      min-width: 25px;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* التذييل السفلي */
    .widget-footer {
      position: absolute;
      bottom: 12px;
      right: 170px;
      left: 70px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #63778a;
    }

    .time-val, .date-val {
      color: #fff;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="widget-wrapper">
    
    <div class="tabs" id="tabsContainer">
      <div class="tab active" id="tabMode">جاري الاتصال بالنظام...</div>
    </div>
    
    <div class="widget-body">
      <div class="number-box" id="totalNumber">0</div>
      
      <div class="stats-section">
        <div class="stat-row">
          <span class="stat-label">رجال</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-men" id="barMen"></div>
          </div>
          <span class="stat-value" id="valMen">0</span>
        </div>
        
        <div class="stat-row">
          <span class="stat-label">نساء</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-women" id="barWomen"></div>
          </div>
          <span class="stat-value" id="valWomen">0</span>
        </div>
        
        <div class="stat-row">
          <span class="stat-label">أطفال</span>
          <div class="progress-bar-container">
            <div class="progress-bar progress-children" id="barChildren"></div>
          </div>
          <span class="stat-value" id="valChildren">0</span>
        </div>
      </div>
      
      <div class="left-section">
        <div class="prayer-row" id="row-الظهر">
          <span>صلاة الظهر</span>
          <span class="badge" id="badge-الظهر">0</span>
        </div>
        <div class="prayer-row" id="row-العصر">
          <span>صلاة العصر</span>
          <span class="badge" id="badge-العصر">0</span>
        </div>
        <div class="prayer-row" id="row-المغرب">
          <span>صلاة المغرب</span>
          <span class="badge" id="badge-المغرب">0</span>
        </div>
      </div>
      
      <div class="widget-footer">
        <div>آخر تحديث: <span class="time-val" id="lastUpdate">--:--</span></div>
        <div id="currentDate" class="date-val">DD - MM - YYYY</div>
      </div>

    </div>
  </div>

  <script>
    // ربط مباشر بـ Google Script الخاص بك
    const API_URL = "https://script.google.com/macros/s/AKfycbzBX9SOYeh4pbI5wLg25hMB7RXVfYPpUO7TQncgzo2MmYc5wK6xPUPLaEARR8U0i9hj/exec";

    async function fetchLiveWidgetData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        // 1. تحديث تبويب الحالة العلوي
        const tabMode = document.getElementById('tabMode');
        if (data.status === "waiting") {
          tabMode.innerText = "ملخص جنائز اليوم";
          tabMode.style.backgroundColor = "#f7b749";
          tabMode.style.color = "#1a2633";
        } else {
          tabMode.innerText = `مباشر الآن: ${data.prayerName || '--'}`;
          tabMode.style.backgroundColor = "#ff7643";
          tabMode.style.color = "#fff";
        }

        // 2. معالجة وحساب الأرقام بناءً على استجابة السكربت الحالي
        let menCount = data.men || 0;
        let womenCount = data.women || 0;
        let kidsCount = data.kids || 0;
        let totalCount = 0;

        if (data.status === "waiting") {
          totalCount = data.summary ? data.summary.reduce((a, b) => a + Number(b.total), 0) : 0;
        } else {
          totalCount = data.total || 0;
        }

        // 3. عرض الأرقام في الواجهة
        document.getElementById('totalNumber').innerText = totalCount;
        document.getElementById('valMen').innerText = menCount;
        document.getElementById('valWomen').innerText = womenCount;
        document.getElementById('valChildren').innerText = kidsCount;
        document.getElementById('lastUpdate').innerText = data.lastUpdate || "--:--";

        // 4. تحديث حركة البارات الانسيابية بنسب مئوية دقيقة وملمومة
        const max = totalCount || 1; 
        document.getElementById('barMen').style.width = `${(menCount / max) * 100}%`;
        document.getElementById('barWomen').style.width = `${(womenCount / max) * 100}%`;
        document.getElementById('barChildren').style.width = `${(kidsCount / max) * 100}%`;

        // 5. تصفير الشارات الجانبية قبل التحديث الجديد
        const prayers = ["الظهر", "العصر", "المغرب"];
        prayers.forEach(p => {
          const badge = document.getElementById(`badge-${p}`);
          const row = document.getElementById(`row-${p}`);
          if(badge) badge.innerText = "0";
          if(row) row.classList.remove('active-row');
        });

        // 6. حقن مصفوفة الـ summary القادمة من قوقل في الخانات الجانبية
        if (data.summary && data.summary.length > 0) {
          data.summary.forEach(item => {
            const cleanName = item.prayer.replace("صلاة ", "").trim();
            const badge = document.getElementById(`badge-${cleanName}`);
            if (badge) {
              badge.innerText = item.total;
            }
          });
        }

        // إضاءة الصف النشط في القائمة الجانبية إذا كانت هناك صلاة مباشرة حالياً
        if (data.status === "live" && data.prayerName) {
          const activeCleanName = data.prayerName.replace("صلاة ", "").trim();
          const activeRow = document.getElementById(`row-${activeCleanName}`);
          if (activeRow) activeRow.classList.add('active-row');
        }

        // تحديث تنسيق ألوان الشارات (تغميق الصفر)
        updateBadgeStyling();

      } catch (error) {
        console.error("خطأ أثناء مزامنة بيانات الويدجت التلقائية:", error);
      }
    }

    function updateBadgeStyling() {
      const prayers = ["الظهر", "العصر", "المغرب"];
      prayers.forEach(p => {
        const badge = document.getElementById(`badge-${p}`);
        if (badge) {
          const val = parseInt(badge.innerText) || 0;
          if (val === 0) {
            badge.style.color = '#2b5075'; 
          } else {
            badge.style.color = '#52a3ff'; 
          }
        }
      });
    }

    // توليد وعرض تاريخ اليوم التلقائي بنسق متوافق مع النظام
    function displayCurrentDate() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      document.getElementById('currentDate').innerText = `${dd} - ${mm} - ${yyyy}`;
    }

    // التشغيل المباشر عند التحميل
    displayCurrentDate();
    fetchLiveWidgetData();

    // فحص دوري دائم كل 30 ثانية لتحديث البيانات خلف الكواليس
    setInterval(fetchLiveWidgetData, 30000);
  </script>
</body>
</html>
